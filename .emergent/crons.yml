crons:
  - name: daily-lead-digest
    description: "Emails hello@amass.africa yesterday's website leads and how many still need a reply, 8am Lagos"
    cron: "0 8 * * *"
    timezone: "Africa/Lagos"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/lead-digest"
    method: POST
    enabled: true
  - name: weekly-lead-trends
    description: "Emails hello@amass.africa last week's website leads vs the week before, Mondays 8am Lagos"
    cron: "0 8 * * 1"
    timezone: "Africa/Lagos"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/weekly-trends"
    method: POST
    enabled: true
  - name: daily-stock-check
    description: "Records marketplace products going out of stock or coming back, daily 7am Lagos"
    cron: "0 7 * * *"
    timezone: "Africa/Lagos"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/stock-check"
    method: POST
    enabled: true
  - name: weekly-restock-reminders
    description: "Emails each retailer contact their out-of-stock products, Mondays 9am Lagos"
    cron: "0 9 * * 1"
    timezone: "Africa/Lagos"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/restock-reminders"
    method: POST
    enabled: true
